[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sophia-command-monitor"
version = "0.1.0"
description = "Shell command capture and live monitoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
sophia-server = "sophia.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["server/sophia"]
